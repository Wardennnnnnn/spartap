<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School sign-in · SparTap</title><link rel="stylesheet" href="/fonts.css"><link rel="stylesheet" href="/styles.css"></head><body><main class="login-box" style="max-width:480px;margin:32px auto;padding:24px"><a href="/">SparTap</a><h1>School sign-in</h1><p>Use the school email assigned to your staff or representative account.</p><a class="btn" id="google" href="/api/auth/google/start" hidden>Continue with Google</a><p id="google-note"></p><label for="purpose">What would you like to do?</label><select id="purpose"><option value="login">Sign in with email code</option><option value="reset">Reset my password</option></select><form id="email-form"><label for="email">School email</label><input class="input" type="email" id="email" autocomplete="email" required maxlength="191"><button class="btn primary" id="send" disabled>Send sign-in code</button></form><form id="code-form" hidden><label for="code">6-digit email code</label><input class="input" id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><div id="password-fields" hidden><label for="password">New password</label><input class="input" id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128"><label for="confirm-password">Confirm new password</label><input class="input" id="confirm-password" type="password" autocomplete="new-password" minlength="12" maxlength="128"></div><button class="btn primary" id="verify">Verify and sign in</button></form><p id="status" role="status" aria-live="polite">Checking sign-in options…</p><a href="/">Use username and password</a></main><script src="/js/school-login.js"></script></body></html>
