services:
  - type: web
    name: spartap
    repo: https://github.com/Wardennnnnnn/spartap
    branch: main
    domains:
      - spartap.terincorp.com
    runtime: node
    plan: free
    region: singapore
    autoDeployTrigger: 'off'
    buildCommand: npm ci && npm run vendor
    startCommand: >-
      node -e 'const fs = require("node:fs"); fs.mkdirSync(".runtime/cloud", {recursive: true}); fs.writeFileSync(".runtime/cloud/tidb-ca.pem", require("node:tls").rootCertificates.join("\n"), {mode: 0o600});'
      && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.23.1
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: '1'
      - key: COOKIE_SECURE
        value: '1'
      - key: DB_SSL
        value: '1'
      - key: DB_SSL_CA_FILE
        value: .runtime/cloud/tidb-ca.pem
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
